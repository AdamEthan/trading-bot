<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bot Settings</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:,">
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <p class="kicker">Paper trading bot</p>
      <h1>Settings</h1>
    </div>
    <div class="actions"><a class="btn" href="/">Dashboard</a></div>
  </header>

  <div class="banner">
    <div class="privacy" id="privacy">Checking where your settings are stored…</div>
  </div>

  <form class="form" id="form" novalidate>
    <fieldset id="strategy-set">
      <legend>Strategy</legend>
      <div class="fields" id="strategy-fields"></div>
      <p class="small muted" id="strategy-desc"></p>
      <div class="fields" id="param-fields"></div>
    </fieldset>
    <div id="sections"></div>
    <div class="savebar">
      <button class="btn primary" type="submit" id="save">Save settings</button>
      <span class="small" id="result" role="status"></span>
    </div>
    <ul class="errors" id="errors"></ul>
  </form>
</main>
<script src="/static/settings.js"></script>
</body>
</html>
